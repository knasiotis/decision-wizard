name: Release

# Two entry points, neither of which runs on ordinary commits — the expensive
# job (the only one needing the Android SDK) stays rare.
#
#   Tag push       -> build, sign, publish a GitHub Release
#   Run workflow   -> build, sign, verify, publish nothing
#
# The version is NOT injected here. It lives in gradle.properties as
# appVersionName, and versionCode is derived from it in app/build.gradle.kts.
# F-Droid builds the tag with a plain `gradle assembleRelease` and passes no -P
# flags, so anything CI supplies would be absent from their APK. This job checks
# the tag agrees with the committed version instead of supplying it.
#
# Versions name end-user functionality. v0.1 is internal and never tagged —
# following one hard-coded flow is not something to release — so the first tag
# is v0.2.0:
#
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - 'v*'
  # Manual signing rehearsal. Builds and signs exactly as a real release would
  # but publishes nothing, so the keystore and secrets can be proven without
  # minting a version number. Versions name user-facing functionality; CI
  # working is not functionality.
  workflow_dispatch:

# Never cancel a release midway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write    # required to create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Written to RUNNER_TEMP, never into the workspace, so it cannot be picked
      # up by a stray `git add` or archived into an artifact.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is not set. See CLAUDE.md for how to create it."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # A tag that disagrees with the committed version would publish an APK
      # whose version nobody else can reproduce, and would break F-Droid's
      # UpdateCheckMode: Tags, which reads the version out of the tagged tree.
      - name: Check the tag matches the committed version
        if: github.ref_type == 'tag'
        run: |
          COMMITTED=$(sed -n 's/^appVersionName=//p' gradle.properties)
          TAGGED="${GITHUB_REF_NAME#v}"
          if [ "$COMMITTED" != "$TAGGED" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAGGED but gradle.properties says $COMMITTED"
            exit 1
          fi
          echo "version $COMMITTED"

      # Tests run in the same Gradle invocation as the build so a broken core
      # can never be published, at no extra runner startup cost.
      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :graphcore:test :app:assembleRelease

      # Signing rehearsal only: prove the keystore decodes and the APK is signed,
      # without creating a release or consuming a version number.
      - name: Verify signature (dry run)
        if: github.ref_type != 'tag'
        run: |
          # Exclude the unsigned variant explicitly. AGP emits
          # app-release-unsigned.apk when no signing config applied, and picking
          # it up blindly would let an unsigned build look like a success.
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no signed APK produced — the keystore secrets did not reach Gradle"
            exit 1
          fi
          echo "built: $APK"
          # The runner has several build-tools versions installed, so an
          # unquoted glob expands to multiple paths and apksigner reads the
          # second as a command. Pick the newest deliberately.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed APK (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: signing-check
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same exclusion as the dry run: never publish the unsigned variant.
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no signed APK produced — refusing to publish"
            exit 1
          fi
          # Obtainium matches on a stable asset name, so keep this format.
          mv "$APK" "decision-wizard-${GITHUB_REF_NAME}.apk"
          # Notes are written by hand into release-notes/<tag>.md — a features
          # section and a fixes section, one plain bullet each with the commit
          # id in brackets. A generated list of commit subjects says what was
          # touched, not what changed for the person installing it.
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              "decision-wizard-${GITHUB_REF_NAME}.apk"
          else
            echo "::warning::$NOTES is missing, falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "decision-wizard-${GITHUB_REF_NAME}.apk"
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
