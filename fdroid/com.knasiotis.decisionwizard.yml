# The F-Droid build recipe for this app.
#
# This file does not do anything sitting here. It is the thing that gets copied
# into a fork of https://gitlab.com/fdroid/fdroiddata as
# metadata/com.knasiotis.decisionwizard.yml, on a branch named after the
# application id, and submitted as a merge request. It is kept in this repo so
# the version recorded here cannot drift away from gradle.properties unnoticed.
#
# Summary, description, changelog and icon are deliberately absent: F-Droid
# reads those from fastlane/metadata/android/en-US/ in this repo, so they live
# in one place rather than two.

Categories:
  - Writing
  - Task
License: GPL-3.0-only
AuthorName: knasiotis
SourceCode: https://github.com/knasiotis/decision-wizard
IssueTracker: https://github.com/knasiotis/decision-wizard/issues
Changelog: https://github.com/knasiotis/decision-wizard/releases

RepoType: git
Repo: https://github.com/knasiotis/decision-wizard.git

Builds:
  - versionName: 0.5.9
    versionCode: 509
    commit: v0.5.9
    subdir: app
    gradle:
      - yes

# Tags are v-prefixed, so the pattern has to be too, or auto-update looks for a
# tag called "0.5.7" and never finds it.
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.5.9
CurrentVersionCode: 509
