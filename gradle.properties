org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# The single source of truth for the app version. It lives here, not in CI,
# because F-Droid builds a plain `gradle assembleRelease` at a tag with no -P
# flags — a CI-injected version would come out as "dev" / 1 there. release.yml
# checks the tag against this value rather than supplying it.
appVersionName=0.5.11
