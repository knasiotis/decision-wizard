name: Test

# :graphcore tests need no Android SDK and are the fast inner loop.
#
# :app is also assembled here, and that matters: it cannot be built on the
# developer machine at all, so without this step nothing would compile it until
# a release tag — and a tag failing to build is the worst place to find out.
# The debug APK is kept as an artifact so a build can be sideloaded and tried
# without cutting a release.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore

# A new push supersedes the previous run for the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  graphcore:
    runs-on: ubuntu-latest    # 1x cost multiplier; never use macos (10x) or windows (2x)
    timeout-minutes: 10       # a hung build cannot run away

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Restores the Gradle build cache and configuration cache between runs.
      # Deliberately no --no-daemon anywhere: it defeats this action's caching.
      - uses: gradle/actions/setup-gradle@v4

      # One invocation so both share a daemon and the cache.
      - name: Test core and build the app
        run: ./gradlew :graphcore:test :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: decision-wizard-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graphcore-test-report
          path: graphcore/build/reports/tests/test
          retention-days: 7
